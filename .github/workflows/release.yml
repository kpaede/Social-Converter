name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Validate plugin
              run: |
                  npm run lint
                  npm run test:browser

            - name: Validate release version
              run: |
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict';
                  import { readFileSync } from 'node:fs';
                  const read = (name) => JSON.parse(readFileSync(name, 'utf8'));
                  const tag = process.env.GITHUB_REF_NAME;
                  const manifest = read('manifest.json');
                  assert.equal(manifest.version, tag, 'Tag must match manifest version');
                  assert.equal(read('package.json').version, tag, 'Package version must match tag');
                  assert.equal(read('versions.json')[tag], manifest.minAppVersion, 'Missing minimum app version');
                  assert(readFileSync(`.github/release-notes/${tag}.md`, 'utf8').trim(), 'Release notes must not be empty');
                  NODE

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --verify-tag \
                    --notes-file=".github/release-notes/$tag.md" \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
